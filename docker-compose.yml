# Instalação com a imagem pronta do ghcr.io: docker compose pull && docker compose up -d
# Lê os segredos do .env (copie o .env.example). O banco fica no volume "dados".
# VERSAO_IMAGEM fixa uma versão (ex.: 1.2.0); sem ela, usa a última publicada (latest).
# Para construir a partir do código: docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
services:
  app:
    image: ghcr.io/devjs2005/issue-doc-generator:${VERSAO_IMAGEM:-latest}
    container_name: issue-doc-generator
    env_file: .env
    environment:
      # Dentro do container o banco fica sempre no volume e a porta é sempre 3000.
      ARQUIVO_BANCO: /app/data/issue-doc-generator.db
      PORTA: "3000"
    ports:
      # Só nesta máquina (127.0.0.1): o proxy com HTTPS, no mesmo servidor, encaminha para cá.
      # Sem proxy, para abrir para a rede, troque por "${PORTA_HOST:-3000}:3000" e deixe
      # CONFIAR_PROXY=false (senão o IP de quem acessa pode ser forjado).
      - "127.0.0.1:${PORTA_HOST:-3000}:3000"
    volumes:
      - dados:/app/data
    restart: unless-stopped
    # Endurecimento: sem capacidades do kernel e sem escalada de privilégio (o app roda como "node").
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

volumes:
  dados:
    name: issue-doc-generator-dados
