<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Gera issues completas e testáveis a partir de uma descrição curta, com técnicas do ISTQB." />
    <link rel="icon" type="image/svg+xml" href="/icone.svg" />
    <title>Issue Doc Generator</title>
    <script>
      // Aplica o tema salvo antes da primeira pintura (evita piscar claro antes do escuro).
      try {
        var t = localStorage.getItem("idg:tema");
        if (t === "claro") document.documentElement.dataset.theme = "light";
        if (t === "escuro") document.documentElement.dataset.theme = "dark";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="raiz"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
