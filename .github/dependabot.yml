# Atualizações semanais de dependências, em PRs agrupados (passam pelo mesmo CI).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      producao:
        dependency-type: production
        update-types: [minor, patch]
      desenvolvimento:
        dependency-type: development
        update-types: [minor, patch]

  # As Actions ficam fixadas por SHA (com a versão no comentário); o Dependabot troca o SHA e o
  # comentário juntos. O mesmo vale para o digest da imagem base no Dockerfile.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    # Todas as Actions num PR só por semana (antes vinha um PR por Action).
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
