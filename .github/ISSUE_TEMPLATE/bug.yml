name: Problema
description: Algo não funciona como deveria.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Não cole chaves de API, senhas nem dados pessoais reais.
  - type: textarea
    id: o-que-aconteceu
    attributes:
      label: O que aconteceu
      description: E o que você esperava que acontecesse.
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Como reproduzir
      placeholder: |
        1. Entrar como...
        2. Gerar uma issue com...
        3. Ver o erro...
    validations:
      required: true
  - type: input
    id: versao
    attributes:
      label: Versão
      placeholder: v1.0.0
  - type: dropdown
    id: provedor
    attributes:
      label: Provedor de IA
      options:
        - Claude
        - ChatGPT (OpenAI)
        - Compatível com OpenAI
        - Gemini
        - Não se aplica
  - type: dropdown
    id: ambiente
    attributes:
      label: Onde roda
      options:
        - Docker
        - npm run dev
        - npm start
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Trecho do log do servidor (JSON), sem dados sensíveis.
      render: shell
