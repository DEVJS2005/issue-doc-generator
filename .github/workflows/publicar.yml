# CD: publica a imagem Docker no GitHub Container Registry (ghcr.io).
# - push na main  -> ghcr.io/<dono>/issue-doc-generator:main  (e :sha-xxxxxxx)
# - tag vX.Y.Z    -> :X.Y.Z, :X.Y e :latest, mais um Release no GitHub com o trecho do CHANGELOG
# Na main, só publica depois do CI passar no mesmo commit.
name: Publicar

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: publicar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  imagem:
    name: Imagem no ghcr.io
    # Na main, só se o CI daquele commit passou (e foi um push, não um PR).
    if: github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # Release da tag
      packages: write # push no ghcr.io
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Versão da tag bate com o package.json e o CHANGELOG
        if: github.event_name == 'push'
        run: |
          versao="${GITHUB_REF_NAME#v}"
          pacote=$(node -p "require('./package.json').version")
          if [ "$versao" != "$pacote" ]; then
            echo "::error::Tag $GITHUB_REF_NAME, mas o package.json está em $pacote."
            exit 1
          fi
          grep -q "^## \[$versao\]" CHANGELOG.md || { echo "::error::CHANGELOG.md sem a seção [$versao]."; exit 1; }

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=main,enable=${{ github.event_name == 'workflow_run' }}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Release no GitHub (só nas tags)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          versao="${GITHUB_REF_NAME#v}"
          awk -v v="$versao" 'index($0, "## [" v "]") == 1 {ok=1; next} ok && /^## \[/ {exit} ok' CHANGELOG.md > notas.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notas.md --verify-tag
