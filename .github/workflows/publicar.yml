# CD: publica a imagem Docker no GitHub Container Registry (ghcr.io).
# - push na main  -> ghcr.io/<dono>/issue-doc-generator:main  (e :sha-xxxxxxx)
# - tag vX.Y.Z    -> :X.Y.Z, :X.Y e :latest, mais um Release no GitHub com o trecho do CHANGELOG
# Na main, só publica depois do CI passar no mesmo commit.
name: Publicar

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*.*.*"]

# Nada por padrão; cada job pede só o que usa.
permissions: {}

concurrency:
  group: publicar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  imagem:
    name: Imagem no ghcr.io
    # Na main, só se o CI daquele commit passou (e foi um push, não um PR).
    if: github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # Release da tag
      packages: write # push no ghcr.io (imagem, SBOM, proveniência e assinatura)
      id-token: write # assinatura sem chave (cosign + OIDC do GitHub)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Versão da tag bate com o package.json e o CHANGELOG
        if: github.event_name == 'push'
        run: |
          versao="${GITHUB_REF_NAME#v}"
          pacote=$(node -p "require('./package.json').version")
          if [ "$versao" != "$pacote" ]; then
            echo "::error::Tag $GITHUB_REF_NAME, mas o package.json está em $pacote."
            exit 1
          fi
          grep -q "^## \[$versao\]" CHANGELOG.md || { echo "::error::CHANGELOG.md sem a seção [$versao]."; exit 1; }

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=main,enable=${{ github.event_name == 'workflow_run' }}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          # SBOM (lista de pacotes da imagem) e proveniência (como e de onde foi construída),
          # publicados junto da imagem no ghcr.io.
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Assinatura sem chave guardada: o cosign usa a identidade OIDC deste workflow. Quem baixa a
      # imagem confere com `cosign verify` (veja o docs/INSTALACAO-DOCKER.md).
      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4

      - name: Assina a imagem (cosign)
        env:
          IMAGEM: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGEM,,}@${DIGEST}"

      - name: Release no GitHub (só nas tags)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          versao="${GITHUB_REF_NAME#v}"
          awk -v v="$versao" 'index($0, "## [" v "]") == 1 {ok=1; next} ok && /^## \[/ {exit} ok' CHANGELOG.md > notas.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notas.md --verify-tag
