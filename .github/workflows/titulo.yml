# Confere o título do PR (Conventional Commits). Fica fora do ci.yml para rodar também quando o
# título é editado, sem repetir os testes a cada edição da descrição.
name: Título do PR

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: titulo-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  titulo:
    name: Título do PR no padrão Conventional Commits
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confere o título (vira a mensagem do squash na main)
        env:
          # Por variável de ambiente, nunca interpolado no script: o título vem do autor do PR.
          TITULO: ${{ github.event.pull_request.title }}
        run: |
          padrao='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .{3,}$'
          if printf '%s' "$TITULO" | grep -Eq "$padrao"; then
            echo "ok: $TITULO"
          else
            echo "::error::Título fora do padrão. Use, por exemplo: 'feat: login por usuário' ou 'fix(admin): ...'."
            echo "Recebido: $TITULO"
            exit 1
          fi
