name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nada por padrão; cada job pede só o que usa.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Typecheck, testes e ponta a ponta
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint (ESLint, zero avisos)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Fragmentos do changelog (changelog.d/)
        run: npm run changelog -- --conferir

      - name: Testes unitários do servidor e da tela (Vitest)
        run: npm test

      - name: Dependências de produção sem vulnerabilidade alta
        run: npm audit --omit=dev --audit-level=high

      - name: Navegador do Playwright
        run: npx playwright install --with-deps chromium

      - name: Ponta a ponta (Playwright, IA falsa)
        run: npm run test:e2e

      - name: Guardar o relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7

  segredos:
    name: Segredos no código (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # lista os commits do PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # os commits do PR inteiros, não só o último
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  docker:
    name: Imagem Docker sobe e responde
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    env:
      # Valores fictícios, só para este teste de fumaça. Nenhuma IA é chamada.
      USUARIO_CI: ci@exemplo.dev
      SENHA_CI: senha-de-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: docker build
        run: docker build -t issue-doc-generator:ci .

      # Vulnerabilidades da imagem (sistema e pacotes npm): falha só em CRITICAL/HIGH que já têm
      # correção publicada, que é o que dá para resolver atualizando.
      - name: Vulnerabilidades da imagem (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: issue-doc-generator:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: docker run (só com variáveis de ambiente, sem .env no repositório)
        run: |
          docker run -d --name idg -p 3000:3000 -v idg-dados:/app/data \
            -e PROVEDOR=anthropic \
            -e USUARIOS_PERMITIDOS="$USUARIO_CI:$SENHA_CI" \
            -e SEGREDO_SESSAO=segredo-de-ci \
            issue-doc-generator:ci

      - name: Espera o /api/saude
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/saude; then echo; exit 0; fi
            sleep 1
          done
          echo "o container não respondeu em 30 s"; exit 1

      - name: Confere tela, login e rotas protegidas
        run: |
          set -e
          curl -fsS http://localhost:3000/ | grep -q "<title>Issue Doc Generator</title>"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/gerar)" = "401"
          curl -fsS -c cookies.txt -H 'content-type: application/json' \
            -d "{\"email\":\"$USUARIO_CI\",\"senha\":\"$SENHA_CI\"}" http://localhost:3000/api/login
          echo
          curl -fsS -b cookies.txt http://localhost:3000/api/opcoes
          echo
          # Sem chave de API, a geração responde 503 "não configurado" (e não 500).
          status=$(curl -s -o resposta.json -w '%{http_code}' -b cookies.txt -H 'content-type: application/json' \
            -d '{"descricao":"teste","tipo":"Correção","produto":"CI","contexto":""}' http://localhost:3000/api/gerar)
          cat resposta.json; echo
          test "$status" = "503"
          grep -q '"nao_configurado"' resposta.json

      - name: O banco (volume) sobrevive a um reinício
        run: |
          set -e
          docker exec idg ls -l /app/data/issue-doc-generator.db
          docker rm -f idg
          # Sem USUARIOS_PERMITIDOS: o usuário tem de vir do banco no volume.
          docker run -d --name idg -p 3000:3000 -v idg-dados:/app/data -e SEGREDO_SESSAO=segredo-de-ci issue-doc-generator:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:3000/api/saude >/dev/null && break; sleep 1; done
          curl -fsS -H 'content-type: application/json' \
            -d "{\"email\":\"$USUARIO_CI\",\"senha\":\"$SENHA_CI\"}" http://localhost:3000/api/login

      - name: Banco vazio mostra o link do primeiro admin no log
        run: |
          set -e
          docker run -d --name idg-vazio -p 3001:3000 issue-doc-generator:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:3001/api/saude >/dev/null && break; sleep 1; done
          docker logs idg-vazio 2>&1 | grep -q "/configurar?codigo="
          curl -s http://localhost:3001/api/sessao | grep -q '"precisaConfigurar":true'

      - name: Logs do container
        if: always()
        run: docker logs idg; docker logs idg-vazio || true
